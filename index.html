<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Devtrack V1</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Header -->
    <header>
        <h1>DevTrack®</h1>
        <h3 id="greeting">Loading greeting...</h3>
        <h3 id="date-display"></h3>
    </header>
    <!-- Main Content Section -->
    <main>
        <section class="Habits">
            <h2>Habits</h2>
            <ul>
                <li>Code</li>
                <li>Read Docs</li>
                <li>Git Commit</li>
                <li>Exercise</li>
            </ul>
        </section>
        <section class="Journal">
            <h2>Today's Journal</h2>
            <!-- i dont understand it but i will try what i undestand-->
            <form action="">
                <label for="learned-progress">Today I Learned </label>
                <textarea id="learned-progress" placeholder="Explain what you learned...."></textarea>
                <label for="Bug">Bug I Solved </label>
                <textarea id="Bug"></textarea>
                <label for="Goal">Tomorrow's Goal </label>
                <textarea id="Goal"></textarea>
                <!-- i think we will add css to remove outline for input -->
            </form>
        </section>
    </main>
    <footer>
        DevTrack V1 &copy
    </footer>
    <script src="script.js"></script>
</body>

</html>
